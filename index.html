<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Certificate Verification — Tech Resonate</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --n:#0B1A2E;
  --n2:#0F1F35;
  --b:#3B82F6;
  --lb:#60A5FA;
  --p:#DCEEFF;
  --w:#FFFFFF;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 20%,rgba(59,130,246,.16),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(96,165,250,.12),transparent 30%),
    linear-gradient(135deg,var(--n),var(--n2));
  color:var(--w);
  overflow-x:hidden;
}

body:before,
body:after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(70px);
  opacity:.35;
  pointer-events:none;
  z-index:-1;
}

body:before{
  width:300px;
  height:300px;
  background:var(--b);
  top:-100px;
  left:-100px;
}

body:after{
  width:300px;
  height:300px;
  background:var(--lb);
  bottom:-100px;
  right:-100px;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  padding:25px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:20px;
}

.logo-mark{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--b),var(--lb));
  color:white;
  font-weight:900;
}

.hero{
  text-align:center;
  padding:70px 0 45px;
}

.hero h1{
  font-size:clamp(34px,6vw,62px);
  line-height:1.05;
  margin-bottom:16px;
}

.hero h1 span{
  color:var(--lb);
}

.hero p{
  max-width:680px;
  margin:auto;
  color:var(--p);
  line-height:1.7;
  font-size:17px;
}

.verification-box{
  max-width:720px;
  margin:0 auto 50px;
  padding:28px;
  border-radius:22px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(16px);
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.input-group{
  display:flex;
  gap:12px;
}

.input-group input{
  flex:1;
  min-width:0;
  padding:16px 18px;
  border:none;
  outline:none;
  border-radius:12px;
  background:rgba(255,255,255,.1);
  color:white;
  font-size:16px;
  border:1px solid rgba(255,255,255,.12);
}

.input-group input::placeholder{
  color:rgba(255,255,255,.55);
}

.verify-button,
.certificate-button{
  border:none;
  text-decoration:none;
  cursor:pointer;
  padding:16px 22px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--b),var(--lb));
  color:white;
  font-weight:800;
  transition:.2s;
  display:inline-block;
}

.verify-button:hover,
.certificate-button:hover{
  transform:translateY(-2px);
}

.message{
  text-align:center;
  margin-top:18px;
  display:none;
  padding:14px;
  border-radius:12px;
}

.message.error{
  display:block;
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.25);
  color:#fecaca;
}

.message.success{
  display:block;
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.25);
  color:#bbf7d0;
}

.result{
  display:none;
  max-width:850px;
  margin:0 auto 60px;
  padding:32px;
  border-radius:22px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(16px);
}

.result.show{
  display:block;
}

.result-header{
  text-align:center;
  margin-bottom:30px;
}

.result-header h2{
  font-size:30px;
  margin-bottom:8px;
}

.result-header p{
  color:var(--p);
}

.verified-badge{
  display:inline-block;
  margin-bottom:15px;
  padding:8px 15px;
  border-radius:30px;
  background:rgba(34,197,94,.15);
  color:#86efac;
  border:1px solid rgba(34,197,94,.25);
  font-weight:800;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.detail{
  padding:18px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
}

.detail small{
  display:block;
  color:rgba(255,255,255,.55);
  margin-bottom:6px;
}

.detail strong{
  display:block;
  word-break:break-word;
}

.photo{
  text-align:center;
  margin-bottom:25px;
}

.photo img{
  width:130px;
  height:160px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid rgba(255,255,255,.15);
}

.payment{
  margin-top:25px;
  padding:22px;
  border-radius:15px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.payment h3{
  margin-bottom:10px;
}

.payment p{
  color:var(--p);
  line-height:1.6;
}

.certificate-area{
  text-align:center;
  margin-top:25px;
  padding-top:25px;
  border-top:1px solid rgba(255,255,255,.08);
}

.certificate-area p{
  color:var(--p);
  margin-bottom:15px;
}

footer{
  text-align:center;
  padding:35px 0;
  color:rgba(255,255,255,.55);
  border-top:1px solid rgba(255,255,255,.08);
}

@media(max-width:650px){
  .input-group{
    flex-direction:column;
  }

  .details{
    grid-template-columns:1fr;
  }

  .verification-box,
  .result{
    padding:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <div class="logo">
      <div class="logo-mark">TR</div>
      <div>Tech Resonate</div>
    </div>
  </div>
</header>

<main>

<section class="hero">
  <div class="container">
    <h1>Official <span>Certificate Verification</span></h1>
    <p>
      Verify the authenticity of a Tech Resonate certificate using the
      unique certificate identification number.
    </p>
  </div>
</section>

<section class="container">

  <div class="verification-box">

    <div class="input-group">
      <input
        type="text"
        id="certificateId"
        placeholder="Enter Certificate ID"
        autocomplete="off"
      >

      <button
        type="button"
        class="verify-button"
        onclick="verifyCertificate()"
      >
        Verify Certificate
      </button>
    </div>

    <div id="message" class="message"></div>

  </div>

  <div id="result" class="result"></div>

</section>

</main>

<footer>
  <div class="container">
    © 2026 Tech Resonate. All rights reserved.
  </div>
</footer>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwYVlT9WS5ov6i0vZc4wienOAwau2ckKVSKe4uMQwM-QCILz3zSxLt4CjWy82iDRy3F7w/exec";


/* =========================================================
   CERTIFICATE FILE LOCATION
   =========================================================

   Every certificate PDF will be stored inside:

   /certificates/

   Example:

   /certificates/TR-2026-DDP-001.pdf

   The website automatically creates the correct URL
   from the Certificate ID.
========================================================= */

const CERTIFICATE_BASE_URL =
  "https://tech-resonate.github.io/certificate-verification/certificates/";


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CREATE CERTIFICATE PDF URL
========================================================= */

function getCertificateFileUrl(certificateId){

  return (
    CERTIFICATE_BASE_URL +
    encodeURIComponent(certificateId) +
    ".pdf"
  );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message,type){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.textContent =
    message;

}


/* =========================================================
   VERIFY CERTIFICATE
========================================================= */

async function verifyCertificate(){

  const input =
    document.getElementById("certificateId");

  /*
    Remove spaces and accidental trailing hyphens.

    So:

    TR-2026-DDP-001

    and

    TR-2026-DDP-001-

    will both search for:

    TR-2026-DDP-001
  */

  const certificateId =
    input.value
      .trim()
      .replace(/-+$/,"");


  if(!certificateId){

    showMessage(
      "Please enter a Certificate ID.",
      "error"
    );

    return;
  }


  showMessage(
    "Verifying certificate...",
    "success"
  );


  const resultBox =
    document.getElementById("result");


  resultBox.classList.remove("show");


  try{

    const response =
      await fetch(
        API_URL +
        "?id=" +
        encodeURIComponent(certificateId)
      );


    if(!response.ok){

      throw new Error(
        "Unable to connect to verification server."
      );

    }


    const data =
      await response.json();


    if(!data.success){

      showMessage(
        data.message ||
        "Certificate not found.",
        "error"
      );

      resultBox.innerHTML = "";

      resultBox.classList.remove("show");

      return;
    }


    showMessage(
      "Certificate verified successfully.",
      "success"
    );


    /*
      Certificate PDF URL is now generated
      directly from the Certificate ID.

      Example:

      TR-2026-DDP-001

      becomes:

      https://tech-resonate.github.io/
      certificate-verification/certificates/
      TR-2026-DDP-001.pdf
    */

    const certificateFileUrl =
      getCertificateFileUrl(
        data.certificateId
      );


    let photoHtml = "";


    if(data.photoUrl){

      photoHtml = `
        <div class="photo">
          <img
            src="${escapeHtml(data.photoUrl)}"
            alt="Certificate holder"
          >
        </div>
      `;

    }


    let certificateHtml = "";


    if(
      String(data.paymentStatus || "")
        .toLowerCase()
        .trim() === "paid"
    ){

      certificateHtml = `

        <div class="certificate-area">

          <p>
            Your certificate is available.
          </p>

          <a
            class="certificate-button"
            href="${escapeHtml(certificateFileUrl)}"
            target="_blank"
            rel="noopener"
          >
            View Certificate
          </a>

        </div>

      `;

    }else{

      certificateHtml = `

        <div class="payment">

          <h3>Payment Required</h3>

          <p>
            This certificate has not yet been marked as paid.
            Please complete the required payment and submit
            your payment reference to the certificate administrator.
          </p>

        </div>

      `;

    }


    resultBox.innerHTML = `

      <div class="result-header">

        <div class="verified-badge">
          ✓ Certificate Verified
        </div>

        <h2>
          Certificate Verification
        </h2>

        <p>
          This certificate record has been found
          in the Tech Resonate verification database.
        </p>

      </div>


      ${photoHtml}


      <div class="details">

        <div class="detail">

          <small>
            Certificate ID
          </small>

          <strong>
            ${escapeHtml(data.certificateId)}
          </strong>

        </div>


        <div class="detail">

          <small>
            Student Name
          </small>

          <strong>
            ${escapeHtml(data.studentName)}
          </strong>

        </div>


        <div class="detail">

          <small>
            Programme
          </small>

          <strong>
            ${escapeHtml(data.programme)}
          </strong>

        </div>


        <div class="detail">

          <small>
            Issue Date
          </small>

          <strong>
            ${escapeHtml(data.issueDate)}
          </strong>

        </div>


        <div class="detail">

          <small>
            Status
          </small>

          <strong>
            ${escapeHtml(data.status)}
          </strong>

        </div>


        <div class="detail">

          <small>
            Payment Status
          </small>

          <strong>
            ${escapeHtml(data.paymentStatus)}
          </strong>

        </div>

      </div>


      ${certificateHtml}

    `;


    resultBox.classList.add("show");


  }catch(error){

    console.error(error);


    showMessage(
      "Could not connect to the certificate verification system.",
      "error"
    );


    resultBox.classList.remove("show");

  }

}


/* =========================================================
   AUTO VERIFY FROM URL
========================================================= */

window.onload = function(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  let id =
    params.get("id");


  if(id){

    id =
      id
        .trim()
        .replace(/-+$/,"");


    document.getElementById(
      "certificateId"
    ).value = id;


    verifyCertificate();

  }

};


/* =========================================================
   ENTER KEY
========================================================= */

document
  .getElementById("certificateId")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        verifyCertificate();

      }

    }
  );

</script>

</body>
</html>
