<script>
/* =========================================================
   EXTRA TEXT + FULL TEXT/LOGO EDITING
   ADDED WITHOUT CHANGING THE ORIGINAL DESIGN
========================================================= */

(function(){

/* ---------------------------------------------------------
   Make additional existing text elements editable
   WITHOUT changing their appearance
--------------------------------------------------------- */

function makeEditable(id, label, selector, zone){

  const el=document.querySelector(selector);

  if(!el) return;

  el.setAttribute("data-editor-id",id);

  if(!ELEMENTS[id]){

    ELEMENTS[id]={
      label:label,
      selector:selector,
      text:true,
      zone:zone||"parent"
    };

  }

}


/* ---------------------------------------------------------
   Existing text inside the certificate that was previously
   not selectable individually
--------------------------------------------------------- */

/* Detail labels */

document.querySelectorAll(".detail").forEach(function(detail,index){

  const label=detail.querySelector(".label");

  if(!label) return;

  const ids=[
    "certificateIdLabel",
    "issueDateLabel",
    "statusLabel",
    "issuedByLabel"
  ];

  const names=[
    "Certificate ID label",
    "Issue Date label",
    "Certificate Status label",
    "Issued By label"
  ];

  const id=ids[index];

  if(id){

    label.id=id;

    label.setAttribute(
      "data-editor-id",
      id
    );

    ELEMENTS[id]={
      label:names[index],
      selector:"#"+id,
      text:true,
      zone:"parent"
    };

  }

});


/* ---------------------------------------------------------
   Seal text
--------------------------------------------------------- */

makeEditable(
  "sealLabel",
  "Seal Certified text",
  ".seal-label",
  "side"
);


/* ---------------------------------------------------------
   Seal year
--------------------------------------------------------- */

makeEditable(
  "sealYear",
  "Seal year",
  "#sealYear",
  "side"
);


/* ---------------------------------------------------------
   MAKE THE LOGO FULLY EDITABLE
--------------------------------------------------------- */

const logo=
  document.getElementById("logo");

if(logo){

  logo.setAttribute(
    "data-editor-id",
    "logo"
  );

}


/* =========================================================
   CERTIFICATE OF COMPLETION
   MAKE THE WHOLE HEADING MOVABLE AS ONE ELEMENT
========================================================= */

const certificateHeading=
  document.getElementById(
    "certificateHeading"
  );

const ofCompletion=
  document.getElementById(
    "ofCompletion"
  );

if(
  certificateHeading &&
  ofCompletion
){

  const headingParent=
    certificateHeading.parentElement;

  /*
     Create a wrapper ONLY if one does not
     already exist.

     The existing Certificate and
     of Completion remain visually unchanged.
  */

  if(
    headingParent &&
    !headingParent.getAttribute(
      "data-completion-group"
    )
  ){

    headingParent.setAttribute(
      "data-completion-group",
      "true"
    );

    /*
       IMPORTANT:
       We do NOT change the parent's
       CSS, position, width, font,
       color, spacing, etc.

       We only register it as a
       movable editor element.
    */

    headingParent.setAttribute(
      "data-editor-id",
      "certificateCompletionGroup"
    );

    headingParent.id=
      "certificateCompletionGroup";

    ELEMENTS.certificateCompletionGroup={
      label:"Certificate of Completion",
      selector:"#certificateCompletionGroup",
      text:true,
      zone:"main"
    };

  }

}


/* ---------------------------------------------------------
   ADD TEXT BUTTON
--------------------------------------------------------- */

const designerSection=
  document.querySelector(
    "#textEditorArea"
  )?.parentElement;

if(designerSection){

  /* -------------------------------------------------------
     ADD NEW TEXT BUTTON
  ------------------------------------------------------- */

  const addTextButton=
    document.createElement("button");

  addTextButton.type="button";

  addTextButton.className="small-action";

  addTextButton.id="addNewText";

  addTextButton.textContent=
    "+ Add New Text";

  addTextButton.style.width="100%";

  addTextButton.style.marginTop="10px";

  designerSection.insertBefore(
    addTextButton,
    document.getElementById(
      "resetSelectedElement"
    )
  );


  /* -------------------------------------------------------
     DELETE / CLEAR BUTTON
  ------------------------------------------------------- */

  const deleteTextButton=
    document.createElement("button");

  deleteTextButton.type="button";

  deleteTextButton.className="small-action";

  deleteTextButton.id=
    "deleteSelectedText";

  deleteTextButton.textContent=
    "Clear / Delete Selected Text";

  deleteTextButton.style.width="100%";

  deleteTextButton.style.marginTop="7px";

  deleteTextButton.style.color="#a61b1b";

  designerSection.insertBefore(
    deleteTextButton,
    document.getElementById(
      "resetSelectedElement"
    )
  );


  /* =======================================================
     ADD NEW TEXT
  ======================================================= */

  addTextButton.addEventListener(
    "click",
    function(){

      const id=
        "customText_" +
        Date.now();

      const newText=
        document.createElement("div");

      newText.id=id;

      newText.setAttribute(
        "data-editor-id",
        id
      );

      newText.textContent=
        "New Text";

      newText.style.position=
        "absolute";

      newText.style.left="50%";

      newText.style.top="50%";

      newText.style.transform=
        "translate(-50%,-50%)";

      newText.style.zIndex="50";

      newText.style.fontFamily=
        "Arial,Helvetica,sans-serif";

      newText.style.fontSize="5mm";

      newText.style.fontWeight="700";

      newText.style.color="#0B1A2E";

      newText.style.whiteSpace=
        "nowrap";

      newText.style.cursor="move";

      certificate.appendChild(
        newText
      );


      ELEMENTS[id]={
        label:"New Text",
        selector:"#"+id,
        text:true,
        zone:"certificate"
      };


      designState[id]={
        x:0,
        y:0,
        rotation:0,
        visible:true,
        text:"New Text",
        color:"#0B1A2E",
        width:null,
        height:null,
        fontSize:5,
        letterSpacing:0,
        lineHeight:1.2,
        textAlign:"left",
        fontWeight:700
      };


      populate();

      selectElement(id);

      controlText.focus();

      controlText.select();

      notify(
        "New text added. Edit it from Text Content."
      );

    }
  );


  /* =======================================================
     CLEAR / DELETE SELECTED TEXT
  ======================================================= */

  deleteTextButton.addEventListener(
    "click",
    function(){

      const metadata=
        ELEMENTS[selectedKey];

      const el=
        elementFor(selectedKey);

      if(!metadata || !el)
        return;


      /* Custom text */

      if(
        selectedKey.startsWith(
          "customText_"
        )
      ){

        el.remove();

        delete ELEMENTS[
          selectedKey
        ];

        delete designState[
          selectedKey
        ];

        populate();

        selectedKey=
          Object.keys(ELEMENTS)[0];

        selectElement(
          selectedKey
        );

        notify(
          "Custom text deleted."
        );

        return;
      }


      /* Existing text */

      if(metadata.text){

        el.textContent="";

        getState(
          selectedKey
        ).text="";

        getState(
          selectedKey
        ).visible=true;

        applyElementState(
          selectedKey
        );

        controlText.value="";

        notify(
          "Selected text cleared."
        );

        return;
      }


      /* Images */

      getState(
        selectedKey
      ).visible=false;

      applyElementState(
        selectedKey
      );

      notify(
        "Selected element hidden."
      );

    }
  );

}


/* ---------------------------------------------------------
   MAKE ALL CURRENT TEXT ELEMENTS SELECTABLE
--------------------------------------------------------- */

const textSelectors=[

  "#officialCertificate",
  "#academyText",
  "#achievementCompletion",

  /*
     Individual heading elements
  */
  "#certificateHeading",
  "#ofCompletion",

  /*
     Combined heading element
  */
  "#certificateCompletionGroup",

  "#presentedTo",
  "#studentName",
  "#programmeDescription",
  "#programme",
  "#certificateId",
  "#issueDate",
  "#status",
  "#issuedByValue",
  "#ceoName",
  "#ceoTitle",
  "#microText",
  "#authenticCredential",
  "#verifyCertificate",
  "#scanToVerify",
  "#verificationDomain",
  "#certificateReference",
  "#sideCertificateId",
  "#sealYear",
  ".seal-label"

];

textSelectors.forEach(
  function(selector){

    const el=
      document.querySelector(
        selector
      );

    if(!el)
      return;

    const editorId=
      el.getAttribute(
        "data-editor-id"
      );

    if(
      editorId &&
      ELEMENTS[editorId]
    )
      return;

  }
);


/* =========================================================
   FIX CUSTOM TEXT ZONE
========================================================= */

const originalGetZoneElement=
  getZoneElement;

window.getZoneElement=
function(key){

  if(
    ELEMENTS[key] &&
    ELEMENTS[key].zone==="certificate"
  ){

    return certificate;

  }

  return originalGetZoneElement(
    key
  );

};


/* =========================================================
   CUSTOM TEXT CENTERING
========================================================= */

const originalCenterSelected=
  centerSelected;

window.centerSelected=
function(axis){

  const metadata=
    ELEMENTS[selectedKey];

  if(
    metadata &&
    metadata.zone==="certificate"
  ){

    const el=
      elementFor(selectedKey);

    const state=
      getState(selectedKey);

    if(!el)
      return;

    const old=
      el.style.transform;

    el.style.transform="none";

    const er=
      el.getBoundingClientRect();

    const zr=
      certificate.getBoundingClientRect();

    el.style.transform=old;

    if(axis==="x"){

      state.x=
        round(
          (
            zr.left+
            zr.width/2-
            (
              er.left+
              er.width/2
            )
          )/
          currentScale,
          1
        );

    }else{

      state.y=
        round(
          (
            zr.top+
            zr.height/2-
            (
              er.top+
              er.height/2
            )
          )/
          currentScale,
          1
        );

    }

    applyElementState(
      selectedKey
    );

    refreshControls();

    return;

  }

  originalCenterSelected(
    axis
  );

};


/* =========================================================
   CUSTOM TEXT RESET
========================================================= */

const originalResetSelectedElement=
  resetSelectedElement;

window.resetSelectedElement=
function(){

  if(
    selectedKey.startsWith(
      "customText_"
    )
  ){

    const el=
      elementFor(selectedKey);

    if(!el)
      return;

    el.textContent=
      "New Text";

    designState[selectedKey]={
      x:0,
      y:0,
      rotation:0,
      visible:true,
      text:"New Text",
      color:"#0B1A2E",
      width:null,
      height:null,
      fontSize:5,
      letterSpacing:0,
      lineHeight:1.2,
      textAlign:"left",
      fontWeight:700
    };

    applyElementState(
      selectedKey
    );

    refreshControls();

    notify(
      "New text reset."
    );

    return;

  }

  originalResetSelectedElement();

};


/* =========================================================
   SAVE NEW TEXT
========================================================= */

const originalSaveDesign=
  saveDesign;

window.saveDesign=
function(){

  Object.entries(
    ELEMENTS
  ).forEach(
    ([key,metadata])=>{

      const el=
        elementFor(key);

      if(
        el &&
        metadata.text
      ){

        getState(
          key
        ).text=
          el.textContent;

        getState(
          key
        ).color=
          getState(key).color ||
          rgbToHex(
            getComputedStyle(
              el
            ).color
          );

      }

    }
  );

  originalSaveDesign();

};


/* =========================================================
   EXTRA KEYBOARD DELETE
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    const tag=
      event.target.tagName;

    if(
      tag==="INPUT" ||
      tag==="TEXTAREA" ||
      tag==="SELECT"
    )
      return;

    if(
      event.key==="Delete" ||
      event.key==="Backspace"
    ){

      const metadata=
        ELEMENTS[selectedKey];

      if(
        metadata &&
        metadata.text
      ){

        event.preventDefault();

        const el=
          elementFor(
            selectedKey
          );

        if(
          selectedKey.startsWith(
            "customText_"
          )
        ){

          el?.remove();

          delete ELEMENTS[
            selectedKey
          ];

          delete designState[
            selectedKey
          ];

          populate();

          selectElement(
            Object.keys(ELEMENTS)[0]
          );

          notify(
            "Text deleted."
          );

        }else{

          if(el){

            el.textContent="";

            getState(
              selectedKey
            ).text="";

            applyElementState(
              selectedKey
            );

            refreshControls();

            notify(
              "Text cleared."
            );

          }

        }

      }

    }

  }
);


/* =========================================================
   FINAL REFRESH
========================================================= */

requestAnimationFrame(
  function(){

    populate();

    selectElement(
      selectedKey
    );

    fitName();

    updatePreviewScale();

  }
);

})();
</script>
